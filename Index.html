                                        </span>
                                        <h3 class="font-bold text-base text-slate-800">{selectedProductDetails.name}</h3>
                                        <p class="text-emerald-700 font-black text-xl">{selectedProductDetails.price.toLocaleString()} Ks</p>
                                        
                                        <div class="text-xs text-slate-600">
                                            <p class="font-bold mb-1">ရရှိနိုင်သော Size များ:</p>
                                            <div class="flex gap-1 flex-wrap">
                                                {selectedProductDetails.sizes.map(s => (
                                                    <span key={s} class="bg-emerald-50 text-emerald-700 font-bold px-2 py-1 rounded-md">{s}</span>
                                                ))}
                                            </div>
                                        </div>

                                        <div class="text-xs text-slate-600">
                                            <p class="font-bold mb-1">အရောင်များ:</p>
                                            <div class="flex gap-1 flex-wrap">
                                                {selectedProductDetails.colors.map(c => (
                                                    <span key={c} class="bg-slate-100 text-slate-700 font-medium px-2 py-1 rounded-md">{c}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <p class="text-xs text-slate-500 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                    {selectedProductDetails.description}
                                </p>

                                <div class="grid grid-cols-2 gap-3 pt-2">
                                    <button 
                                        onClick={() => {
                                            addToCart(selectedProductDetails, selectedProductDetails.sizes[0], selectedProductDetails.colors[0]);
                                            setSelectedProductDetails(null);
                                        }}
                                        class="py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs rounded-2xl transition-all"
                                    >
                                        <i class="fa-solid fa-cart-plus"></i> ခြင်းထဲထည့်မည်
                                    </button>

                                    <a 
                                        href={`${socialLinks.messenger}?text=မင်္ဂလာပါ၊ အထည် Code: ${selectedProductDetails.code} (${selectedProductDetails.name}) အား မှာယူလိုပါသည်...`}
                                        target="_blank"
                                        rel="noreferrer"
                                        class="py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs rounded-2xl flex items-center justify-center gap-1.5 transition-all shadow"
                                    >
                                        <i class="fa-brands fa-facebook-messenger"></i> Direct မှာမည်
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CART DRAWER */}
                    {isCartOpen && (
                        <div class="fixed inset-0 z-50 flex justify-end bg-slate-900/40 backdrop-blur-sm">
                            <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between p-6 animate-in slide-in-from-right duration-200">
                                <div>
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                                        <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                                            <i class="fa-solid fa-bag-shopping text-emerald-600"></i> ဝယ်ယူမည့် အထည်များ
                                        </h3>
                                        <button onClick={() => setIsCartOpen(false)} class="p-2 text-slate-400 hover:text-slate-600">
                                            <i class="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    <div class="space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar pr-1">
                                        {cart.map(item => (
                                            <div key={item.key} class="flex items-center gap-3 p-2 bg-slate-50 rounded-2xl border border-slate-100">
                                                <img src={item.image} alt={item.name} class="w-14 h-14 object-cover rounded-xl" />
                                                <div class="flex-grow">
                                                    <span class="text-[10px] font-bold text-emerald-600">CODE: {item.code}</span>
                                                    <h4 class="font-bold text-xs text-slate-800 line-clamp-1">{item.name}</h4>
                                                    <p class="text-[10px] text-slate-500">Size: {item.size} | Color: {item.color}</p>
                                                    <p class="font-bold text-xs text-slate-800 mt-0.5">{item.price.toLocaleString()} Ks</p>
                                                </div>
                                                <div class="flex flex-col items-center gap-1">
                                                    <button onClick={() => updateCartQty(item.key, 1)} class="w-6 h-6 rounded-full bg-white shadow text-xs font-bold">+</button>
                                                    <span class="text-xs font-bold">{item.qty}</span>
                                                    <button onClick={() => updateCartQty(item.key, -1)} class="w-6 h-6 rounded-full bg-white shadow text-xs font-bold">-</button>
                                                </div>
                                            </div>
                                        ))}

                                        {cart.length === 0 && (
                                            <div class="text-center py-12 text-slate-400">
                                                <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-slate-200"></i>
                                                <p class="text-xs font-bold">ခြင်းထဲတွင် အထည်မရှိသေးပါ</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {cart.length > 0 && (
                                    <div class="border-t border-slate-100 pt-4 space-y-3">
                                        <div class="flex justify-between items-center text-slate-800 font-extrabold text-base">
                                            <span>စုစုပေါင်း:</span>
                                            <span class="text-emerald-700">{cartTotal.toLocaleString()} Ks</span>
                                        </div>

                                        <button 
                                            onClick={() => {
                                                setIsCartOpen(false);
                                                setCheckoutModalOpen(true);
                                            }}
                                            class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-2xl shadow-lg shadow-emerald-200 text-xs sm:text-sm flex items-center justify-center gap-2"
                                        >
                                            <i class="fa-solid fa-credit-card"></i> အော်ဒါ တင်မည်
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT FORM MODAL */}
                    {checkoutModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-2xl relative space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <button onClick={() => setCheckoutModalOpen(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i class="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <h3 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-3">
                                    ဝယ်ယူသူ အချက်အလက် ဖြည့်သွင်းရန်
                                </h3>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    const newOrder = {
                                        id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
                                        customerName: formData.get('name'),
                                        phone: formData.get('phone'),
                                        address: formData.get('address'),
                                        paymentMethod: formData.get('paymentMethod'),
                                        items: cart,
                                        totalAmount: cartTotal,
                                        status: 'Pending',
                                        date: new Date().toLocaleString(),
                                        note: formData.get('note')
                                    };

                                    setOrders([newOrder, ...orders]);
                                    setCart([]);
                                    setCheckoutModalOpen(false);
                                    setOrderSuccessModal(newOrder);
                                }} class="space-y-3">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">အမည် *</label>
                                        <input required name="name" type="text" placeholder="မိတ်ဆွေ အမည်" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none" />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">ဖုန်းနံပါတ် *</label>
                                        <input required name="phone" type="tel" placeholder="09xxxxxxxxx" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none" />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">ပို့ဆောင်ရမည့် လိပ်စာ *</label>
                                        <textarea required name="address" rows="2" placeholder="မြို့နယ်၊ လမ်း၊ အိမ်အမှတ်" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none"></textarea>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">ငွေပေးချေမှု နည်းလမ်း</label>
                                        <select name="paymentMethod" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none">
                                            <option value="KBZ Pay">KBZ Pay ({socialLinks.kbzPay})</option>
                                            <option value="WavePay">WavePay ({socialLinks.wavePay})</option>
                                            <option value="Cash on Delivery">အိမ်ရောက်ငွေချေ (COD)</option>
                                        </select>
                                    </div>

                                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-2xl text-xs sm:text-sm shadow-md">
                                        အော်ဒါ အတည်ပြု အပြီးသတ်မည် ({cartTotal.toLocaleString()} Ks)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ORDER SUCCESS POPUP */}
                    {orderSuccessModal && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div class="bg-white max-w-sm w-full rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                                <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto">
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800">အော်ဒါ တင်ခြင်း အောင်မြင်ပါသည်။</h3>
                                <p class="text-xs text-slate-500">Order ID: <span class="font-bold text-slate-800">{orderSuccessModal.id}</span></p>

                                <div class="bg-slate-50 p-3 rounded-2xl text-left text-xs space-y-1">
                                    <p class="font-bold text-slate-700">မှာယူသူ: {orderSuccessModal.customerName}</p>
                                    <p class="text-slate-500">ကျသင့်ငွေ: {orderSuccessModal.totalAmount.toLocaleString()} Ks</p>
                                </div>

                                <div class="space-y-2 pt-2">
                                    <a 
                                        href={`${socialLinks.messenger}?text=မင်္ဂလာပါ၊ Order ID: ${orderSuccessModal.id} ဖြင့် အထည်မှာယူထားပါသည်...`}
                                        target="_blank"
                                        rel="noreferrer"
                                        class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2"
                                    >
                                        <i class="fa-brands fa-facebook-messenger"></i> Messenger သို့ စာပို့မည်
                                    </a>

                                    <button 
                                        onClick={() => setOrderSuccessModal(null)}
                                        class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                                    >
                                        ပိတ်မည်
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RECEIPT / VOUCHER PRINT MODAL */}
                    {selectedVoucherOrder && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-2xl space-y-4 relative">
                                <button onClick={() => setSelectedVoucherOrder(null)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i class="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div class="text-center border-b border-dashed border-slate-200 pb-4">
                                    <h3 class="font-bold text-base text-slate-800">{socialLinks.shopName}</h3>
                                    <p class="text-xs text-slate-500">အရောင်း ဘောင်ချာ (Sales Voucher)</p>
                                    <p class="text-[10px] text-slate-400 mt-1">Order ID: {selectedVoucherOrder.id} | {selectedVoucherOrder.date}</p>
                                </div>

                                <div class="text-xs space-y-1">
                                    <p><span class="font-bold">ဝယ်သူ:</span> {selectedVoucherOrder.customerName}</p>
                                    <p><span class="font-bold">ဖုန်း:</span> {selectedVoucherOrder.phone}</p>
                                    <p><span class="font-bold">လိပ်စာ:</span> {selectedVoucherOrder.address}</p>
                                </div>

                                <table class="w-full text-left text-xs border-y border-slate-200 my-2 divide-y divide-slate-100">
                                    <thead>
                                        <tr class="text-slate-500 py-1">
                                            <th class="py-1">အထည်/Code</th>
                                            <th class="text-center">အရေအတွက်</th>
                                            <th class="text-right">ကျသင့်ငွေ</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {selectedVoucherOrder.items.map((it, idx) => (
                                            <tr key={idx}>
                                                <td class="py-1.5">{it.name} ({it.code})</td>
                                                <td class="text-center">{it.qty}</td>
                                                <td class="text-right">{(it.price * it.qty).toLocaleString()} Ks</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                <div class="flex justify-between items-center font-bold text-sm text-slate-800 pt-1">
                                    <span>စုစုပေါင်း ကျသင့်ငွေ:</span>
                                    <span class="text-emerald-700">{selectedVoucherOrder.totalAmount.toLocaleString()} Ks</span>
                                </div>

                                <button 
                                    onClick={() => window.print()}
                                    class="w-full py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2"
                                >
                                    <i class="fa-solid fa-print"></i> ဘောင်ချာ Print ထုတ်မည်
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
```
