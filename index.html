/* =========================================================
   SAFE LOCALSTORAGE
   ========================================================= */
function loadStored(key, fallback) {
  const clone = () => JSON.parse(JSON.stringify(fallback));
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return clone();
    const parsed = JSON.parse(raw);
    return (parsed === null || parsed === undefined) ? clone() : parsed;
  } catch (err) {
    console.error('Failed to load "' + key + '":', err);
    return clone();
  }
}

function loadPin() {
  try {
    return localStorage.getItem(STORAGE_KEYS.pin) || '1234';
  } catch (err) {
    return '1234';
  }
}

    } catch (e) {
      console.error('Storage save failed:', e);

  },

  /* ---------- UI FEEDBACK ---------- */
  showToast(msg, type = 'success') {
    this.state.toast = { msg, type };
    this.render();
    if (this._toastTimer) clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      this.state.toast = null;
      this.render();
    }, 3000);
  },

  /* ---------- NAVIGATION / FILTERS ---------- */
  setActiveTab(tab) {
    this.state.activeTab = tab;
    this.render();
  },

  setCategory(cat) {
    this.state.selectedCategory = cat;
    this.render();
  },

  setSearch(q) {
    this.state.searchQuery = q;
    this.render();
    // FIX: Re-focus the freshly rendered search input so typing isn't interrupted.
    const input = document.querySelector('[data-search]');
    if (input) {
      input.focus({ preventScroll: true });
      const len = input.value.length;
      try { input.setSelectionRange(len, len); } catch (e) { /* ignore */ }
    }
  },

  /* ---------- CART ---------- */
  addToCart(prodId, size, color) {
    const prod = this.state.products.find(p => p.id === prodId);
    if (!prod) return;

    // FIX: Block adding items that are out of stock.
    if (Number(prod.stock) <= 0) {
      this.showToast('ဤပစ္စည်းမှာ လက်ကျန်မရှိတော့ပါ', 'error');
      return;
    }

    const s = size || (Array.isArray(prod.sizes) && prod.sizes[0]) || 'Free Size';
    const c = color || (Array.isArray(prod.colors) && prod.colors[0]) || 'Standard';
    const key = `${prod.id}-${s}-${c}`;

    const existing = this.state.cart.find(item => item.key === key);
    if (existing) {
      existing.qty += 1;
    } else {
      this.state.cart.push({
        key,
        id: prod.id,
        code: prod.code,
        name: prod.name,
        price: prod.price,
        image: prod.image,
        size: s,
        color: c,
        qty: 1
      });
    }

    this.state.selectedProduct = null;
    this.showToast(`"${prod.name}" အား ခြင်းထဲသို့ ထည့်ပြီးပါပြီ!`);
  },

  updateCartQty(key, delta) {
    const idx = this.state.cart.findIndex(i => i.key === key);
    if (idx === -1) return;
    this.state.cart[idx].qty += delta;
    if (this.state.cart[idx].qty <= 0) this.state.cart.splice(idx, 1);
    this.render();
  },

  removeFromCart(key) {
    this.state.cart = this.state.cart.filter(i => i.key !== key);
    this.render();
  },

  toggleCart(isOpen) {
    this.state.isCartOpen = isOpen;
    this.render();
  },

  /* ---------- PRODUCT DETAIL ---------- */
  openProductDetail(id) {
    const prod = this.state.products.find(p => p.id === id);
    if (!prod) return;
    this.state.selectedProduct = {
      ...prod,
      selectedSize: (Array.isArray(prod.sizes) && prod.sizes[0]) || 'Free Size',
      selectedColor: (Array.isArray(prod.colors) && prod.colors[0]) || 'Standard'
    };
    this.render();
  },

  closeProductDetail() {
    this.state.selectedProduct = null;
    this.render();
  },

  selectProductSize(index) {
    const p = this.state.selectedProduct;
    if (!p || !Array.isArray(p.sizes)) return;
    p.selectedSize = p.sizes[index];
    this.render();
  },

  selectProductColor(index) {
    const p = this.state.selectedProduct;
    if (!p || !Array.isArray(p.colors)) return;
    p.selectedColor = p.colors[index];
    this.render();
  },

  addSelectedToCart() {
    const p = this.state.selectedProduct;
    if (!p) return;
    this.addToCart(p.id, p.selectedSize, p.selectedColor);
  },

  /* ---------- ADMIN AUTH ---------- */

  closeAdminModal() {
    this.state.showAdminModal = false;

      this.state.showAdminModal = false;

    } else {

  },

      code: 'PROD-' + randomDigits(3),
      name: '',
      category: ALL_CATEGORIES[1],

      image: FALLBACK_IMAGE,
      description: ''

  openEditProduct(id) {
    if (id) {
      const prod = this.state.products.find(p => p.id === id);
      if (!prod) return;
      this.state.editingProduct = {
        ...prod,
        sizesStr: (prod.sizes || []).join(', '),
        colorsStr: (prod.colors || []).join(', ')
      };
    } else {
      this.state.editingProduct = this.blankProduct();
    }
    this.render();
  },

  saveProductFromForm(form) {
    const p = this.state.editingProduct;
    if (!p) return;

    const sizes = String(form.sizes.value || '').split(',').map(s => s.trim()).filter(Boolean);
    const colors = String(form.colors.value || '').split(',').map(c => c.trim()).filter(Boolean);

    const updatedProd = {
      id: p.id,
      code: (form.code.value || '').trim() || ('PROD-' + Date.now()),
      name: (form.name.value || '').trim(),
      category: form.category.value,
      price: Number(form.price.value) || 0,
      costPrice: Number(form.costPrice.value) || 0,
      stock: Number(form.stock.value) || 0,
      sizes: sizes.length ? sizes : ['Free Size'],
      colors: colors.length ? colors : ['Standard'],
      image: (form.image.value || '').trim() || FALLBACK_IMAGE,
      description: (form.description.value || '').trim()
    };

    if (!updatedProd.name) {
      this.showToast('အထည်အမည် ထည့်သွင်းပေးပါ', 'error');
      return;
    }

    const idx = this.state.products.findIndex(prod => prod.id === p.id);
    if (idx !== -1) {
      this.state.products[idx] = updatedProd;
      this.showToast('အထည်အချက်အလက် ပြင်ဆင်ပြီးပါပြီ');
    } else {
      this.state.products.unshift(updatedProd);
      this.showToast('အထည်သစ် အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ');
        }

  this.saveState();
  this.state.editingProduct = null;
  this.state.activeTab = 'inventory';
  this.render();
},

promptDeleteProduct(id) {
  const prod = this.state.products.find(p => p.id === id);
  if (!prod) return;
  this.state.deleteConfirm = {
    type: 'product',
    id: prod.id,
    title: 'အထည်စာရင်း ဖျက်ရန် အတည်ပြုပါ',
    message: `"${prod.name}" အား စာရင်းမှ ဖျက်ပစ်ရန် သေချာပါသလား?`
  };
  this.render();
},

promptDeleteExpense(id) {
  const ex = this.state.expenses.find(e => e.id === id);
  if (!ex) return;
  this.state.deleteConfirm = {
    type: 'expense',
    id: ex.id,
    title: 'ကုန်ကျစရိတ် ဖျက်ရန် အတည်ပြုပါ',
    message: `"${ex.title}" အား ဖျက်ပစ်ရန် သေချာပါသလား?`
  };
  this.render();
},

confirmDelete() {
  const dc = this.state.deleteConfirm;
  if (!dc) return;

  if (dc.type === 'product') {
    this.state.products = this.state.products.filter(p => p.id !== dc.id);
    this.showToast('အထည်စာရင်း ဖျက်ပြီးပါပြီ', 'error');
  } else if (dc.type === 'expense') {
    this.state.expenses = this.state.expenses.filter(e => e.id !== dc.id);
    this.showToast('ကုန်ကျစရိတ် ဖျက်ပြီးပါပြီ', 'error');
  }

  this.saveState();
  this.state.deleteConfirm = null;
  this.render();
},

cancelDelete() {
  this.state.deleteConfirm = null;
  this.render();
},

/* ---------- CHECKOUT / ORDERS ---------- */
openCheckout() {
  if (this.state.cart.length === 0) {
    this.showToast('ခြင်းထဲတွင် ပစ္စည်းမရှိသေးပါ', 'error');
    return;
  }
  this.state.isCartOpen = false;
  this.state.showCheckoutModal = true;
  this.render();
},

closeCheckout() {
  this.state.showCheckoutModal = false;
  this.render();
},

submitCheckout(form) {
  if (this.state.cart.length === 0) return;

  const newOrder = {
    id: 'ORD-' + randomDigits(4),
    customerName: (form.customerName.value || '').trim(),
    phone: (form.phone.value || '').trim(),
    address: (form.address.value || '').trim(),
    paymentMethod: form.paymentMethod.value,
    note: (form.note.value || '').trim() || '-',
    items: JSON.parse(JSON.stringify(this.state.cart)),
    totalAmount: this.state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
    status: 'Pending',
    date: new Date().toISOString().replace('T', ' ').substring(0, 16)
  };

  if (!newOrder.customerName || !newOrder.phone || !newOrder.address) {
    this.showToast('အချက်အလက် အားလုံး ဖြည့်စွက်ပေးပါ', 'error');
    return;
  }

  // FIX: Decrement product stock based on ordered quantities.
  this.state.cart.forEach(item => {
    const prod = this.state.products.find(p => p.id === item.id);
    if (prod) {
      prod.stock = Math.max(0, Number(prod.stock || 0) - Number(item.qty || 0));
    }
  });

  this.state.orders.unshift(newOrder);
  this.state.cart = [];
  this.state.showCheckoutModal = false;
  this.state.isCartOpen = false;
  this.state.orderSuccessModal = newOrder;
  this.saveState();
  this.render();
},

closeOrderSuccess() {
  this.state.orderSuccessModal = null;
  this.render();
},

updateOrderStatus(orderId, newStatus) {
  const order = this.state.orders.find(o => o.id === orderId);
  if (!order) return;
  order.status = newStatus;
  this.saveState();
  this.showToast(`Order #${orderId} အခြေအနေအား ${newStatus} သို့ ပြောင်းပြီးပါပြီ`);
},

viewVoucher(orderId) {
  const order = this.state.orders.find(o => o.id === orderId);
  if (!order) return;
  this.state.voucherOrder = order;
  this.render();
},

closeVoucher() {
  this.state.voucherOrder = null;
  this.render();
},

printVoucher() {
  window.print();
},

/* ---------- EXPENSES ---------- */
addExpense(form) {
  const title = (form.title.value || '').trim();
  const amount = Number(form.amount.value) || 0;
  if (!title || amount <= 0) {
    this.showToast('အသုံးစရိတ် အမည်နှင့် ပမာဏ ဖြည့်ပါ', 'error');
    return;
  }

  const newEx = {
    id: 'EX-' + Date.now().toString().slice(-6),
    title,
    amount,
    category: form.category.value,
    date: new Date().toISOString().split('T')[0]
  };

  this.state.expenses.unshift(newEx);
  this.saveState();
  this.showToast('ကုန်ကျစရိတ် စာရင်းသွင်းပြီးပါပြီ');
  form.reset();
  this.render();
},

deleteExpense(id) {
  this.state.expenses = this.state.expenses.filter(e => e.id !== id);
  this.saveState();
  this.showToast('ကုန်ကျစရိတ် ဖျက်ပြီးပါပြီ', 'error');
  this.render();
},

/* ---------- SETTINGS ---------- */
saveSettingsForm(form) {
  this.state.social.shopName = (form.shopName.value || '').trim() || defaultSocial.shopName;
  this.state.social.phone    = (form.phone.value || '').trim();
  this.state.social.messenger = (form.messenger.value || '').trim();
  this.state.social.telegram  = (form.telegram.value || '').trim();
  this.state.social.kbzPay    = (form.kbzPay.value || '').trim();
  this.state.social.wavePay   = (form.wavePay.value || '').trim();

  const newPin = (form.newPin && form.newPin.value ? form.newPin.value : '').trim();
  if (newPin) this.state.adminPin = newPin;

  this.saveState();
  this.showToast('အချက်အလက်များနှင့် ဆက်တင်များ အောင်မြင်စွာ ပြင်ဆင်ပြီးပါပြီ');
  this.render();
},

/* =======================================================
   RENDER
   ======================================================= */
render() {
  const appEl = document.getElementById('app');
  if (!appEl) return;

  // Preserve scroll positions across full re-render
  const scrollY = window.scrollY;
  const oldCartList = document.getElementById('cartItems');
  const cartScroll = oldCartList ? oldCartList.scrollTop : 0;

  const s = this.state;
  let mainContent = '';

  if (s.role === 'admin') {
    switch (s.activeTab) {
      case 'inventory':  mainContent = this.renderInventory(); break;
      case 'addProduct': mainContent = this.renderProductForm(); break;
      case 'orders':     mainContent = this.renderOrders(); break;
      case 'ledger':     mainContent = this.renderLedger(); break;
      case 'settings':   mainContent = this.renderSettings(); break;
      default:           mainContent = this.renderShop();
    }
  } else {
    mainContent = this.renderShop();
  }

  appEl.innerHTML = `
    <div class="flex flex-col min-h-screen pb-20 lg:pb-0">
      ${this.renderHeader()}
      <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        ${mainContent}
      </main>
      ${this.renderFooter()}
      ${this.renderMobileNav()}
    </div>
    ${this.renderProductModal()}
    ${this.renderCartDrawer()}
    ${this.renderCheckoutModal()}
    ${this.renderOrderSuccessModal()}
    ${this.renderVoucherModal()}
    ${this.renderAdminModal()}
    ${this.renderDeleteModal()}
    ${this.renderToast()}
  `;

  window.scrollTo(0, scrollY);
  const newCartList = document.getElementById('cartItems');
  if (newCartList) newCartList.scrollTop = cartScroll;
},

      </div>
    </form>
  </section>`;
},

/* ---------- ORDERS (ADMIN) ---------- */
renderOrders() {
  const { orders } = this.state;

  const statusColor = {
    Pending:   'bg-amber-100 text-amber-700',
    Confirmed: 'bg-sky-100 text-sky-700',
    Shipped:   'bg-indigo-100 text-indigo-700',
    Delivered: 'bg-emerald-100 text-emerald-700',
    Cancelled: 'bg-rose-100 text-rose-600'
  };

  if (orders.length === 0) {
    return `
    <section>
      <h2 class="font-black text-slate-800 text-lg mb-4">Order စီမံခန့်ခွဲမှု</h2>
      <div class="text-center py-20 bg-white rounded-2xl border border-dashed border-slate-200 text-slate-400 text-sm font-bold">အော်ဒါ မရှိသေးပါ</div>
    </section>`;
  }

  const card = (o) => `
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-black text-slate-800">${escapeHtml(o.id)}</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusColor[o.status] || 'bg-slate-100 text-slate-600'}">${escapeHtml(o.status)}</span>
          </div>
          <p class="text-xs text-slate-500 mt-1.5"><i class="fa-solid fa-user text-slate-400"></i> ${escapeHtml(o.customerName)} · ${escapeHtml(o.phone)}</p>
          <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot text-slate-400"></i> ${escapeHtml(o.address)}</p>
        </div>
        <div class="text-right">
          <p class="font-black text-emerald-700">${formatMMK(o.totalAmount)}</p>
          <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(o.date)}</p>
        </div>
      </div>

      <div class="mt-3 border-t border-dashed border-slate-200 pt-3 space-y-1">
    /* ---------- LEDGER (ADMIN) ---------- */
  renderLedger() {
    const { orders, expenses, products } = this.state;

    const validOrders = orders.filter(o => o.status !== 'Cancelled');
    const revenue = validOrders.reduce((n, o) => n + Number(o.totalAmount || 0), 0);

    const cogs = validOrders.reduce((sum, o) => {
      const orderCost = o.items.reduce((s, it) => {
        const prod = products.find(p => p.id === it.id || p.code === it.code);
        const cost = prod ? Number(prod.costPrice || 0) : 0;
        return s + cost * Number(it.qty || 0);
      }, 0);
      return sum + orderCost;
    }, 0);

    const totalExpense = expenses.reduce((n, e) => n + Number(e.amount || 0), 0);
    const netProfit = (revenue - cogs) - totalExpense;

    const stat = (label, value, icon, color) => `
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl ${color} flex items-center justify-center text-lg">
            <i class="fa-solid ${icon}"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[11px] font-bold text-slate-400">${label}</p>
            <p class="font-black text-slate-800 truncate">${value}</p>
          </div>
        </div>
      </div>`;

    const inputCls = 'w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-400';

    return `
    <section class="space-y-6">
      <div>
        <h2 class="font-black text-slate-800 text-lg">ဝင်/ထွက် စာရင်း</h2>
        <p class="text-xs text-slate-400">အရောင်းနှင့် အသုံးစရိတ် အနှစ်ချုပ်</p>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        ${stat('စုစုပေါင်း အရောင်း', formatMMK(revenue), 'fa-sack-dollar', 'bg-emerald-50 text-emerald-600')}
        ${stat('အရင်းကုန်ကျ (COGS)', formatMMK(cogs), 'fa-boxes-packing', 'bg-sky-50 text-sky-600')}
        ${stat('ဆိုင်စရိတ် စုစုပေါင်း', formatMMK(totalExpense), 'fa-file-invoice-dollar', 'bg-amber-50 text-amber-600')}
        ${stat('အသားတင် အမြတ်', formatMMK(netProfit), 'fa-chart-line', netProfit >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600')}
      </div>

      <div class="grid lg:grid-cols-5 gap-5">
        <!-- Add expense -->
        <div class="lg:col-span-2">
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <h3 class="font-black text-slate-800 text-sm mb-3"><i class="fa-solid fa-plus text-emerald-600"></i> ကုန်ကျစရိတ် ထည့်ရန်</h3>
            <form data-form="expense" class="space-y-3">
              <input name="title" required placeholder="အသုံးစရိတ် အမည်" class="${inputCls}">
              <input name="amount" type="number" min="0" required placeholder="ပမာဏ (ကျပ်)" class="${inputCls}">
              <select name="category" class="${inputCls} bg-white">
                <option value="ဆိုင်စရိတ်">ဆိုင်စရိတ်</option>
                <option value="ထုပ်ပိုးစရိတ်">ထုပ်ပိုးစရိတ်</option>
                <option value="သယ်ယူပို့ဆောင်စရိတ်">သယ်ယူပို့ဆောင်စရိတ်</option>
                <option value="ဝန်ထမ်းစရိတ်">ဝန်ထမ်းစရိတ်</option>
                <option value="အထည်အလိပ် ဝယ်ယူစရိတ်">အထည်အလိပ် ဝယ်ယူစရိတ်</option>
                <option value="အခြား">အခြား</option>
              </select>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700">
                စာရင်းသွင်းမည်
              </button>
            </form>
          </div>
        </div>

        <!-- Expense list -->
        <div class="lg:col-span-3">
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100">
              <h3 class="font-black text-slate-800 text-sm">ကုန်ကျစရိတ် စာရင်း (${expenses.length})</h3>
            </div>
            ${expenses.length === 0
              ? `<div class="py-14 text-center text-slate-400 text-sm font-bold">စာရင်း မရှိသေးပါ</div>`
              : `<div class="divide-y divide-slate-100 max-h-[420px] overflow-y-auto custom-scrollbar">
                   ${expenses.map(e => `
                     <div class="px-5 py-3 flex items-center justify-between gap-3">
                       <div class="min-w-0">
                         <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(e.title)}</p>
                         <p class="text-[10px] text-slate-400">${escapeHtml(e.category)} · ${escapeHtml(e.date)}</p>
                       </div>
                       <div class="flex items-center gap-3 shrink-0">
                         <span class="text-xs font-black text-rose-600">-${formatMMK(e.amount)}</span>
                         <button data-action="delete-expense" data-id="${escapeHtml(e.id)}"
                           class="w-7 h-7 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-100">
                           <i class="fa-solid fa-trash text-[10px]"></i>
                         </button>
                       </div>
                     </div>`).join('')}
                 </div>`}
          </div>
        </div>
      </div>
    </section>`;
  },

  /* ---------- SETTINGS (ADMIN) ---------- */
  renderSettings() {
    const { social } = this.state;
    const inputCls = 'mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-400';
    const labelCls = 'text-xs font-bold text-slate-600';

    return `
    <section class="max-w-2xl">
      <div class="mb-4">
        <h2 class="font-black text-slate-800 text-lg">ချိတ်ဆက်မှု &amp; ဆက်တင်</h2>
        <p class="text-xs text-slate-400">ဆိုင်အချက်အလက်၊ ငွေပေးချေမှုနှင့် PIN ပြောင်းလဲခြင်း</p>
      </div>

      <form data-form="settings" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 space-y-4">
        <div>
          <label class="${labelCls}">ဆိုင်အမည်</label>
          <input name="shopName" value="${escapeHtml(social.shopName)}" class="${inputCls}">
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="${labelCls}">ဖုန်းနံပါတ်</label>
            <input name="phone" value="${escapeHtml(social.phone)}" class="${inputCls}">
          </div>
          <div>
            <label class="${labelCls}">Admin PIN အသစ်</label>
            <input name="newPin" type="password" placeholder="မပြောင်းလိုပါက ချန်ထားပါ" class="${inputCls}">
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="${labelCls}">Messenger Link</label>
            <input name="messenger" value="${escapeHtml(social.messenger)}" class="${inputCls}">
          </div>
          <div>
            <label class="${labelCls}">Telegram Link</label>
            <input name="telegram" value="${escapeHtml(social.telegram)}" class="${inputCls}">
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="${labelCls}">KBZ Pay</label>
            <input name="kbzPay" value="${escapeHtml(social.kbzPay)}" class="${inputCls}">
          </div>
          <div>
            <label class="${labelCls}">Wave Pay</label>
            <input name="wavePay" value="${escapeHtml(social.wavePay)}" class="${inputCls}">
          </div>
        </div>

        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 shadow-md shadow-emerald-200">
          <i class="fa-solid fa-floppy-disk"></i> သိမ်းဆည်းမည်
        </button>
      </form>
    </section>`;
  }
};

/* =========================================================
   GLOBAL EVENT DELEGATION
   ========================================================= */

/* --- Clicks --- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;

  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'set-tab':
      app.setActiveTab(el.dataset.tab);
      break;

    case 'set-category':
      app.setCategory(el.dataset.cat);
      break;

    /* --- Products --- */
    case 'open-product':      app.openProductDetail(id); break;
    case 'close-product':     app.closeProductDetail(); break;
    case 'select-size':       app.selectProductSize(Number(el.dataset.index)); break;
    case 'select-color':      app.selectProductColor(Number(el.dataset.index)); break;
    case 'add-selected':      app.addSelectedToCart(); break;
    case 'quick-add':         app.addToCart(id); break;

    /* --- Cart --- */
    case 'open-cart':   app.toggleCart(true); break;
    case 'close-cart':  app.toggleCart(false); break;
    case 'cart-inc':    app.updateCartQty(el.dataset.key, 1); break;
    case 'cart-dec':    app.updateCartQty(el.dataset.key, -1); break;
    case 'cart-remove': app.removeFromCart(el.dataset.key); break;

    /* --- Checkout / orders --- */
    case 'open-checkout':   app.openCheckout(); break;
    case 'close-checkout':  app.closeCheckout(); break;
    case 'close-success':   app.closeOrderSuccess(); break;
    case 'view-voucher':    app.viewVoucher(id); break;
    case 'close-voucher':   app.closeVoucher(); break;
    case 'print-voucher':   app.printVoucher(); break;

    /* --- Admin --- */
    case 'open-admin':   app.openAdminModal(); break;
    case 'close-admin':  app.closeAdminModal(); break;
    case 'logout':       app.logoutAdmin(); break;

    /* --- Product CRUD --- */
    // FIX: Set activeTab before rendering so only a single re-render occurs.
    case 'new-product':
      app.state.activeTab = 'addProduct';
      app.openEditProduct(null);
      break;
    case 'edit-product':
      app.state.activeTab = 'addProduct';
      app.openEditProduct(id);
      break;
    case 'cancel-edit':
      app.state.editingProduct = null;
      app.setActiveTab('inventory');
      break;
    case 'delete-product': app.promptDeleteProduct(id); break;

    /* --- Expenses --- */
    case 'delete-expense': app.promptDeleteExpense(id); break;

    /* --- Delete confirm --- */
    case 'confirm-delete': app.confirmDelete(); break;
    case 'cancel-delete':  app.cancelDelete(); break;

    default:
      break;
  }
});

/* --- Form submits --- */
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();

  switch (form.dataset.form) {
    case 'checkout':  app.submitCheckout(form); break;
    case 'product':   app.saveProductFromForm(form); break;
    case 'expense':   app.addExpense(form); break;
    case 'settings':  app.saveSettingsForm(form); break;
    case 'admin-pin': app.loginAdmin(form); break;
    default: break;
  }
});

/* --- Search input (delegated) --- */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el && el.matches('[data-search]')) {
    app.setSearch(el.value);
  }
});

/* --- Order status change --- */
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el && el.dataset && el.dataset.statusFor) {
    app.updateOrderStatus(el.dataset.statusFor, el.value);
  }
});

/* --- ESC closes top-most modal --- */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const s = app.state;
  if (s.deleteConfirm)          { app.cancelDelete(); }
  else if (s.voucherOrder)      { app.closeVoucher(); }
  else if (s.orderSuccessModal) { app.closeOrderSuccess(); }
  else if (s.showCheckoutModal) { app.closeCheckout(); }
  else if (s.isCartOpen)        { app.toggleCart(false); }
  else if (s.selectedProduct)   { app.closeProductDetail(); }
  else if (s.showAdminModal)    { app.closeAdminModal(); }
});

/* =========================================================
   BOOT
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => app.render());
if (document.readyState !== 'loading') app.render();
</script>
</body>
</html>
